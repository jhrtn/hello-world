<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hello — Joseph</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
  }

  body { cursor: none; }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

</style>
</head>
<body>
  <canvas id="stage"></canvas>

<script>
(() => {
  'use strict';

  /* ---- a 5x7 bitmap font, only the glyphs this page needs ---- */
  const FONT = {
    H: ['10001','10001','10001','11111','10001','10001','10001'],
    E: ['11111','10000','10000','11110','10000','10000','11111'],
    L: ['10000','10000','10000','10000','10000','10000','11111'],
    O: ['01110','10001','10001','10001','10001','10001','01110'],
    I: ['111','010','010','010','010','010','111'],
    M: ['10001','11011','10101','10001','10001','10001','10001'],
    J: ['00111','00010','00010','00010','00010','10010','01100'],
    S: ['01111','10000','10000','01110','00001','00001','11110'],
    P: ['11110','10001','10001','11110','10000','10000','10000'],
    ',': ['00','00','00','00','00','01','10'],
    "'": ['1','1','0','0','0','0','0'],
  };

  const LINES = ['HELLO,', "I'M", 'JOSEPH'];
  const GLYPH_ROWS = 7;
  const TRACKING = 1;   // cells between glyphs
  const LEADING  = 3;   // cells between lines

  const INK  = '244, 241, 234';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  let W = 0, H = 0, cell = 0, offX = 0, offY = 0;
  const bits = [];   // one per lit pixel of the type

  /* ---- layout: size the grid, then sit the type on it ---- */
  const layout = () => {
    W = innerWidth;
    H = innerHeight;

    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const lineWidths = LINES.map(line =>
      [...line].reduce((w, ch) => w + FONT[ch][0].length + TRACKING, 0) - TRACKING
    );
    const blockCols = Math.max(...lineWidths);
    const blockRows = LINES.length * GLYPH_ROWS + (LINES.length - 1) * LEADING;

    cell = Math.max(6, Math.floor(Math.min(
      (W * 0.6) / blockCols,
      (H * 0.4) / blockRows,
      16
    )));

    // the grid's phase is derived from the type, so the block is exactly
    // centred and every bit still lands on a cell boundary
    offX = (W - blockCols * cell) / 2;
    offY = (H - blockRows * cell) / 2;
    let i = 0;

    LINES.forEach((line, li) => {
      const startCol = Math.round((blockCols - lineWidths[li]) / 2);
      const top = li * (GLYPH_ROWS + LEADING);
      let col = startCol;

      for (const ch of line) {
        const glyph = FONT[ch];
        glyph.forEach((rowBits, r) => {
          [...rowBits].forEach((bit, c) => {
            if (bit !== '1') return;
            const hx = offX + (col + c) * cell;
            const hy = offY + (top + r) * cell;
            const b = bits[i];
            if (b) { b.hx = hx; b.hy = hy; }
            else bits[i] = { hx, hy, x: hx, y: hy, vx: 0, vy: 0 };
            i++;
          });
        });
        col += glyph[0].length + TRACKING;
      }
    });

    bits.length = i;
  };

  /* ---- pointer ---- */
  const pointer = { x: -9999, y: -9999, active: false };
  const wake = (x, y) => {
    pointer.x = x; pointer.y = y; pointer.active = true;
  };
  addEventListener('pointermove', e => wake(e.clientX, e.clientY), { passive: true });
  addEventListener('pointerleave', () => {
    pointer.active = false; pointer.x = pointer.y = -9999;
  });
  addEventListener('resize', () => { layout(); if (reduced) draw(); });

  /* ---- drawing ---- */
  const snap = (v, off) => Math.round((v - off) / cell) * cell + off;

  const drawGrid = () => {
    ctx.lineWidth = 1;
    ctx.strokeStyle = `rgba(${INK}, 0.055)`;
    ctx.beginPath();
    for (let c = Math.floor(-offX / cell); c <= Math.ceil((W - offX) / cell); c++) {
      const x = Math.round(offX + c * cell) + 0.5;
      ctx.moveTo(x, 0); ctx.lineTo(x, H);
    }
    for (let r = Math.floor(-offY / cell); r <= Math.ceil((H - offY) / cell); r++) {
      const y = Math.round(offY + r * cell) + 0.5;
      ctx.moveTo(0, y); ctx.lineTo(W, y);
    }
    ctx.stroke();
  };

  const drawCursorCell = () => {
    if (!pointer.active) return;
    const x = snap(pointer.x - cell / 2, offX);
    const y = snap(pointer.y - cell / 2, offY);

    const glow = ctx.createRadialGradient(
      pointer.x, pointer.y, 0, pointer.x, pointer.y, cell * 9
    );
    glow.addColorStop(0, `rgba(${INK}, 0.07)`);
    glow.addColorStop(1, `rgba(${INK}, 0)`);
    ctx.fillStyle = glow;
    ctx.fillRect(pointer.x - cell * 9, pointer.y - cell * 9, cell * 18, cell * 18);

    ctx.lineWidth = 1;
    ctx.strokeStyle = `rgba(${INK}, 0.4)`;
    ctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, cell - 1, cell - 1);
  };

  const drawBits = () => {
    const inset = Math.max(0.5, cell * 0.07);
    const size = cell - inset * 2;

    for (const b of bits) {
      // the bit drifts freely, but it is only ever *drawn* in a grid cell
      const gx = snap(b.x, offX);
      const gy = snap(b.y, offY);
      const wander = Math.hypot(gx - b.hx, gy - b.hy) / cell;
      const alpha = 1 - Math.min(wander / 14, 0.55);

      ctx.fillStyle = `rgba(${INK}, ${alpha.toFixed(3)})`;
      ctx.fillRect(gx + inset, gy + inset, size, size);
    }
  };

  const draw = () => {
    ctx.clearRect(0, 0, W, H);
    drawGrid();
    drawCursorCell();
    drawBits();
  };

  /* ---- motion ---- */
  const SPRING = 0.07;
  const DAMP   = 0.86;
  const PUSH   = 32;

  const step = () => {
    const radius = cell * 8.5;

    for (const b of bits) {
      if (pointer.active) {
        const dx = b.x - pointer.x;
        const dy = b.y - pointer.y;
        const dist = Math.hypot(dx, dy) || 0.001;
        if (dist < radius) {
          const force = (1 - dist / radius) ** 2 * PUSH / dist;
          b.vx += dx * force;
          b.vy += dy * force;
        }
      }

      b.vx += (b.hx - b.x) * SPRING;
      b.vy += (b.hy - b.y) * SPRING;
      b.vx *= DAMP;
      b.vy *= DAMP;
      b.x += b.vx;
      b.y += b.vy;
    }

    draw();
    requestAnimationFrame(step);
  };

  layout();
  if (reduced) draw();
  else requestAnimationFrame(step);
})();
</script>
</body>
</html>
